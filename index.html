<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret Spy - Live Multiplayer & Voice</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      margin: 0; background: #0f172a; color: #f8fafc;
      display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px;
    }
    .app {
      width: 100%; max-width: 440px; background: #1e293b;
      border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1, h2, h3 { margin-top: 0; text-align: center; }
    .badge {
      background: #334155; padding: 6px 12px; border-radius: 999px;
      font-size: 12px; display: inline-block; margin-bottom: 10px;
    }
    input, button {
      width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px;
      border: none; font-size: 15px;
    }
    input { background: #0f172a; color: #fff; border: 1px solid #334155; }
    button {
      background: #6366f1; color: white; font-weight: bold; cursor: pointer;
    }
    button.secondary { background: #10b981; }
    button.danger { background: #ef4444; }
    button.outline { background: transparent; border: 1px solid #475569; }
    .hidden { display: none !important; }
    .player-card {
      background: #0f172a; padding: 10px 14px; border-radius: 12px;
      margin: 6px 0; display: flex; justify-content: space-between; align-items: center;
    }
    .small-btn {
      width: auto; padding: 6px 10px; font-size: 12px; margin: 0 0 0 5px;
    }
    .word-box {
      background: linear-gradient(135deg, #6366f1, #ec4899);
      padding: 18px; border-radius: 16px; text-align: center; margin: 12px 0;
    }
    .chat-box {
      height: 140px; overflow-y: auto; background: #0f172a;
      padding: 10px; border-radius: 12px; font-size: 14px; margin-top: 10px;
    }
    .chat-input-row { display: flex; gap: 6px; }
    .chat-input-row input { flex: 1; }
    .chat-input-row button { width: auto; padding: 0 16px; }
    #voice-container {
      width: 100%; height: 150px; border-radius: 12px; overflow: hidden;
      background: #0f172a; margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SCREEN 1: LOGIN -->
    <div id="screen-login">
      <div style="text-align:center;"><span class="badge">🕵️ LIVE VOICE + MULTIPLAYER v4</span></div>
      <h1>Secret Spy</h1>
      <p style="text-align:center; color:#94a3b8; font-size:14px;">
        Play with friends or random players online, give voice hints, and catch the Spy!
      </p>
      <input type="text" id="usernameInput" placeholder="Enter your username (e.g. Sara)" />
      <button type="button" onclick="doLogin()">Continue 🚀</button>
    </div>

    <!-- SCREEN 2: LOBBY -->
    <div id="screen-lobby" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="badge" id="userBadge">Player</span>
        <span class="badge" id="playerIdBadge">ID: #0000</span>
      </div>
      <h2>Game Lobby</h2>

      <button type="button" class="secondary" onclick="doQuickMatch()">🌍 Quick Play (Random Match)</button>
      <button type="button" onclick="doCreateRoom()">🏠 Create Private Room</button>

      <div style="margin-top:12px; border-top:1px solid #334155; padding-top:12px;">
        <input type="text" id="joinCodeInput" placeholder="Enter Room Code (e.g. SPY420)" />
        <button type="button" class="outline" onclick="doJoinCode()">🔑 Join with Code</button>
      </div>

      <div style="margin-top:14px;">
        <h3 style="font-size:15px; text-align:left; color:#cbd5e1;">👥 Saved Friends</h3>
        <div id="friendsList"></div>
      </div>
    </div>

    <!-- SCREEN 3 & 4: LIVE ROOM + GAME -->
    <div id="screen-room" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="badge" id="roomCodeDisplay">Room: ---</span>
        <button type="button" class="small-btn outline" onclick="doCopyInvite()">📋 Copy Invite</button>
      </div>

      <div id="voice-container"></div>

      <div id="waiting-section">
        <h3 style="font-size:16px;">Players in Room (Min 2 to Start)</h3>
        <div id="roomPlayersList"></div>
        <button type="button" class="secondary" onclick="doStartGame()">🎮 Start Game</button>
      </div>

      <div id="game-section" class="hidden">
        <div class="word-box">
          <div style="font-size:12px; opacity:0.9;">Your Secret Word Is:</div>
          <h2 id="secretWordText" style="margin:6px 0 0 0; font-size:26px;">---</h2>
          <p id="roleHintText" style="font-size:12px; margin-bottom:0;"></p>
        </div>
        <h3 style="font-size:14px; text-align:left;">🗳️ Who is the Spy? (Cast Your Vote)</h3>
        <div id="votePlayersList"></div>
        <button type="button" class="outline" onclick="doStartGame()">🔄 Next Round</button>
      </div>

      <div class="chat-box" id="chatBox"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Type a hint or message..." />
        <button type="button" onclick="doSendChat()">Send</button>
      </div>

      <button type="button" class="danger" style="margin-top:10px;" onclick="doLeaveRoom()">🚪 Leave Room</button>
    </div>
  </div>

  <!-- 1. CORE UI SCRIPT (Loads First - Never Blocked) -->
  <script>
    var currentUser = { name: "", id: "", uid: "" };
    var currentRoomCode = "";
    var zegoInstance = null;
    var db = null;
    var WORDS = ["Pizza", "Airplane", "Coffee", "Football", "Beach", "Cinema", "Smartphone", "Hospital", "Library", "Rain", "Chocolate", "Bicycle"];

    function showScreen(id) {
      document.getElementById("screen-login").classList.add("hidden");
      document.getElementById("screen-lobby").classList.add("hidden");
      document.getElementById("screen-room").classList.add("hidden");
      document.getElementById(id).classList.remove("hidden");
    }

    function doLogin() {
      var name = document.getElementById("usernameInput").value.trim();
      if (!name) {
        alert("Please enter your username first!");
        return;
      }
      var numId = Math.floor(1000 + Math.random() * 9000);
      currentUser = {
        name: name,
        id: "#" + numId,
        uid: "user_" + numId + "_" + Date.now().toString().slice(-4)
      };
      document.getElementById("userBadge").innerText = "👤 " + currentUser.name;
      document.getElementById("playerIdBadge").innerText = "ID: " + currentUser.id;
      renderFriends();
      showScreen("screen-lobby");
    }

    function renderFriends() {
      var friends = JSON.parse(localStorage.getItem("spy_friends") || "[]");
      var box = document.getElementById("friendsList");
      if (friends.length === 0) {
        box.innerHTML = '<p style="color:#64748b; font-size:13px;">No saved friends yet. Click "+ Add Friend" inside a room!</p>';
        return;
      }
      box.innerHTML = "";
      friends.forEach(function(f) {
        box.innerHTML += '<div class="player-card"><span>🟢 ' + f.name + ' (' + f.id + ')</span><button type="button" class="small-btn" onclick="doCreateRoom()">New Room</button></div>';
      });
    }

    function saveFriend(name, id) {
      var friends = JSON.parse(localStorage.getItem("spy_friends") || "[]");
      if (!friends.some(function(f) { return f.id === id; })) {
        friends.push({ name: name, id: id });
        localStorage.setItem("spy_friends", JSON.stringify(friends));
        alert("✅ " + name + " added to Friends List!");
        renderFriends();
      }
    }

    function doCopyInvite() {
      var text = "Join my Secret Spy game room! Room Code: " + currentRoomCode;
      if (navigator.clipboard) navigator.clipboard.writeText(text);
      alert("Invite copied! Share with friends:\n\n" + text);
    }
  </script>

  <!-- 2. FIREBASE & ZEGOCLOUD SCRIPTS (Loaded Safely at Bottom) -->
  <script src="https://unpkg.com"></script>
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyCZdsngz77rDveN_b4QOkR6JP2W5hmMXK4",
      authDomain: "://firebaseapp.com",
      databaseURL: "https://firebaseio.com",
      projectId: "secret-spy-548c8",
      storageBucket: "secret-spy-548c8.firebasestorage.app",
      messagingSenderId: "41267848411",
      appId: "1:41267848411:web:ba2990fa576551b407d8fe",
      measurementId: "G-9HFNH5HP6P"
    };

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      console.log("Firebase note:", e);
    }

    var ZEGO_APP_ID = 601093113;
    var ZEGO_SERVER_SECRET = "411349c1f9f6eef09cc83a47d6338fee";

    function doCreateRoom() {
      if (!db) return alert("Connecting to server, please wait 2 seconds and try again!");
      var code = "SPY" + Math.floor(100 + Math.random() * 900);
      db.ref("rooms/" + code).set({
        code: code,
        isPublic: false,
        status: "waiting",
        word: "",
        spyUid: ""
      }).then(function() {
        joinRoom(code);
      });
    }

    function doJoinCode() {
      if (!db) return alert("Connecting to server, please wait 2 seconds and try again!");
      var code = document.getElementById("joinCodeInput").value.trim().toUpperCase();
      if (!code) return alert("Please enter a valid Room Code!");
      db.ref("rooms/" + code).once("value").then(function(snap) {
        if (!snap.exists()) return alert("❌ Room code not found!");
        joinRoom(code);
      });
    }

    function doQuickMatch() {
      if (!db) return alert("Connecting to server, please wait 2 seconds and try again!");
db.ref("rooms").once("value").then(function(snap) {
var foundCode = null;
if (snap.exists()) {
var rooms = snap.val();
for (var k in rooms) {
var r = rooms[k];
var pCount = r.players ? Object.keys(r.players).length : 0;
if (r.isPublic && r.status === "waiting" && pCount < 6) {
foundCode = k;
break;
}
}
}
if (!foundCode) {
foundCode = "PUB" + Math.floor(100 + Math.random() * 900);
db.ref("rooms/" + foundCode).set({
code: foundCode,
isPublic: true,
status: "waiting",
word: "",
spyUid: ""
}).then(function() {
joinRoom(foundCode);
});
} else {
joinRoom(foundCode);
}
});
}
function joinRoom(code) {
currentRoomCode = code;
document.getElementById("roomCodeDisplay").innerText = "Room: " + code;
var playerRef = db.ref("rooms/" + code + "/players/" + currentUser.uid);
playerRef.set({
name: currentUser.name,
id: currentUser.id,
uid: currentUser.uid
}).then(function() {
playerRef.onDisconnect().remove();
startVoiceChat(code);
listenToRoom(code);
showScreen("screen-room");
});
}
function startVoiceChat(roomID) {
try {
if (typeof ZegoUIKitPrebuilt !== "undefined") {
var kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(
ZEGO_APP_ID,
ZEGO_SERVER_SECRET,
roomID,
currentUser.uid,
currentUser.name
);
zegoInstance = ZegoUIKitPrebuilt.create(kitToken);
zegoInstance.joinRoom({
container: document.querySelector("#voice-container"),
scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
turnOnCameraWhenJoining: false,
showMyCameraToggleButton: false,
showScreenSharingButton: false,
showTextChat: false,
showUserList: false,
turnOnMicrophoneWhenJoining: true
});
}
} catch (e) {
console.log("Voice chat note:", e);
}
}
function listenToRoom(code) {
db.ref("rooms/" + code).on("value", function(snapshot) {
if (!snapshot.exists()) return;
var data = snapshot.val();
var playersObj = data.players || {};
var playersArr = Object.values(playersObj);
var list = document.getElementById("roomPlayersList");
list.innerHTML = "";
playersArr.forEach(function(p) {
var isMe = p.uid === currentUser.uid;
list.innerHTML += '' + p.name + (isMe ? " (You)" : "") + ' ' + p.id + '' + (isMe ? '' : '+ Add Friend') + '';
});
if (data.status === "playing") {
document.getElementById("waiting-section").classList.add("hidden");
document.getElementById("game-section").classList.remove("hidden");
var amISpy = data.spyUid === currentUser.uid;
document.getElementById("secretWordText").innerText = amISpy ? "🕵️ YOU ARE THE SPY!" : data.word.toUpperCase();
document.getElementById("roleHintText").innerText = amISpy
? "You don't have the secret word! Listen closely and blend in."
: "Give a subtle 1-word or short clue without saying the secret word!";
var voteList = document.getElementById("votePlayersList");
voteList.innerHTML = "";
playersArr.forEach(function(p) {
voteList.innerHTML += '' + p.name + 'Vote Spy';
});
} else {
document.getElementById("waiting-section").classList.remove("hidden");
document.getElementById("game-section").classList.add("hidden");
}
var chatBox = document.getElementById("chatBox");
chatBox.innerHTML = "";
if (data.messages) {
Object.values(data.messages).forEach(function(m) {
chatBox.innerHTML += '' + m.sender + ': ' + m.text + '';
});
chatBox.scrollTop = chatBox.scrollHeight;
}
});
}
function doStartGame() {
db.ref("rooms/" + currentRoomCode + "/players").once("value").then(function(snap) {
if (!snap.exists()) return;
var players = Object.values(snap.val());
if (players.length < 2) return alert("At least 2 players are needed to start! Share your Room Code with a friend.");
var randomWord = WORDS[Math.floor(Math.random() * WORDS.length)];
var randomSpy = players[Math.floor(Math.random() * players.length)];
db.ref("rooms/" + currentRoomCode).update({
status: "playing",
word: randomWord,
spyUid: randomSpy.uid
});
});
}
function castVote(votedUid, votedName, realSpyUid, word) {
var msg = votedUid === realSpyUid
? "🎉 " + currentUser.name + " caught the Spy! " + votedName + " was the Spy! (Secret Word: " + word + ")"
: "❌ " + currentUser.name + " voted wrong! " + votedName + " is not the Spy.";
db.ref("rooms/" + currentRoomCode + "/messages").push({
sender: "SYSTEM",
text: msg
});
}
function doSendChat() {
var input = document.getElementById("chatInput");
var text = input.value.trim();
if (!text) return;
db.ref("rooms/" + currentRoomCode + "/messages").push({
sender: currentUser.name,
text: text
});
input.value = "";
}
function doLeaveRoom() {
if (currentRoomCode && db) {
db.ref("rooms/" + currentRoomCode + "/players/" + currentUser.uid).remove();
}
if (zegoInstance) {
try { zegoInstance.destroy(); } catch (e) {}
}
currentRoomCode = "";
showScreen("screen-lobby");
}
